name: Device support or beta feedback
description: Request support for another light or report hardware results for a beta profile.
title: "[Device]: "
labels:
  - device-support
body:
  - type: input
    id: model
    attributes:
      label: Light model
      description: Include the exact model printed on the light or power supply.
      placeholder: NEEWER PL60C
    validations:
      required: true
  - type: input
    id: advertised_name
    attributes:
      label: Bluetooth advertised name
      description: Preserve spaces, hyphens, capitalization, and any suffix.
      placeholder: NEEWER-PL60C
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Integration version tested
      placeholder: 0.4.0-beta.3
    validations:
      required: true
  - type: input
    id: home_assistant_version
    attributes:
      label: Home Assistant version
      placeholder: 2026.10.0
    validations:
      required: true
  - type: dropdown
    id: bluetooth_transport
    attributes:
      label: Bluetooth transport
      options:
        - Local Bluetooth adapter
        - ESPHome Bluetooth proxy
        - Both local adapter and ESPHome proxy
        - Other / unknown
    validations:
      required: true
  - type: dropdown
    id: discovery_result
    attributes:
      label: Automatic discovery result
      description: Check Settings → Devices & Services before using Add Integration or entering an address. Observations must precede manual setup; record failure details in Test details below. If already configured, choose the corresponding unverified option.
      multiple: false
      options:
        - Discovered automatically before adding the integration manually
        - Not discovered automatically and manual setup was needed
        - Not checked
        - Already configured so discovery was not checked
    validations:
      required: true
  - type: dropdown
    id: result
    attributes:
      label: Control test result
      options:
        - Not tested yet; requesting support
        - Power control works
        - Brightness works
        - Color temperature works
        - RGB color works
        - Nothing responds
        - Partially works; details below
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Test details
      description: List every control you tested and what the physical light did. Record automatic-discovery failure observations separately from control results here.
    validations:
      required: true
  - type: textarea
    id: references
    attributes:
      label: Protocol or product references
      description: Optional links to protocol implementations, product pages, or existing upstream issues and pull requests.
  - type: checkboxes
    id: follow_up
    attributes:
      label: Hardware follow-up
      options:
        - label: I can test a future beta on this physical light and report the results.
