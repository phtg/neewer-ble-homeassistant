name: Bug report
description: Report a problem with an already supported Neewer light.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve the integration. Please remove Bluetooth connections from the Neewer app before reproducing the problem.
  - type: input
    id: model
    attributes:
      label: Light model
      description: Include the exact model printed on the light or power supply.
      placeholder: NEEWER GL1 PRO
    validations:
      required: true
  - type: input
    id: advertised_name
    attributes:
      label: Bluetooth advertised name
      description: This is the name Home Assistant or a BLE scanner sees.
      placeholder: NEEWER-GL1 PRO
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: Include both the integration version and Home Assistant version.
      placeholder: Integration 0.4.0-beta.1; Home Assistant 2026.9.0
    validations:
      required: true
  - type: dropdown
    id: connection
    attributes:
      label: Bluetooth connection
      options:
        - Built-in or USB Bluetooth adapter
        - ESPHome Bluetooth proxy
        - Other
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe what you expected, what happened instead, and the shortest way to reproduce it.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant debug logs
      description: Paste logs from custom_components.neewer_ble after removing Bluetooth addresses or other private data.
      render: text
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I verified that the Neewer mobile or desktop app is disconnected from the light.
          required: true
        - label: I searched existing issues for the same model and symptom.
          required: true
